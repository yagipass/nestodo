version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(nix)
    labels: [dependencies]
    groups:
      flake-inputs:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(web)
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(cli)
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(desktop)
    labels: [dependencies]
    groups:
      gpui-pre:
        patterns: ["gpui-pre*"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["gpui-pre*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(android)
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(actions)
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
