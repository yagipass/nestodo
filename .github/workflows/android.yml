name: Android

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - flake.nix
      - flake.lock
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - flake.nix
      - flake.lock
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - run: nix develop ../..#android --command ./gradlew spotlessCheck test assembleDebug -Pnestodo.baseUrl=https://nestodo.example.com
