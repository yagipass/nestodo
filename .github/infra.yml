apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: nestodo
  owner: yagipass
reconcile:
  deployment_branch_policies: authoritative
spec:
  description: A family todo list on Cloudflare Workers with D1 storage, built with Void and protected by Cloudflare Access.
  visibility: public
  archived: false
  topics:
  - cloudflare-access
  - cloudflare-d1
  - cloudflare-workers
  - react
  - nestodo
  labels:
  - name: accessibility
    description: Barrier affecting people with disabilities
    color: f143ab
  - name: android
    description: Pull requests that change the shipped Android app code
    color: 3ddc84
  - name: bug
    description: Something isn't working
    color: d73a4a
  - name: cli
    description: Pull requests that change the shipped CLI code
    color: 1d76db
  - name: dependencies
    description: Pull requests that update a dependency file
    color: 0366d6
  - name: desktop
    description: Pull requests that change the shipped desktop app code
    color: fbca04
  - name: documentation
    description: Improvements or additions to documentation
    color: 0075ca
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: enhancement
    description: New feature or request
    color: a2eeef
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This doesn't seem right
    color: e4e669
  - name: maintenance
    description: Build, CI, and refactoring work that users do not see
    color: c5def5
  - name: question
    description: Further information is requested
    color: d876e3
  - name: tagpr
    color: ededed
  - name: tagpr:major
    description: Bump the major version in the release
    color: ededed
  - name: tagpr:minor
    description: Bump the minor version in the release
    color: ededed
  - name: web
    description: Pull requests that change the shipped web app code
    color: 5319e7
  - name: wontfix
    description: This will not be worked on
    color: ffffff
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests:
      creation: collaborators_only
  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true
  rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    bypass_actors:
    - role: admin
      bypass_mode: pull_request
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: false
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: false
      required_status_checks:
        strict_required_status_checks_policy: false
        contexts:
        - context: checks
          app: github-actions
        - context: web
          app: github-actions
      non_fast_forward: true
      update: false
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  - name: protect-release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
        - refs/tags/v*
    rules:
      non_fast_forward: false
      update: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: first_time_contributors
  environments:
  - name: Cachix
    wait_timer: 0
    can_admins_bypass: true
    reviewers: []
    deployment_branch_policy:
      custom_branch_policies:
      - name: main
  - name: Cloudflare
    wait_timer: 0
    can_admins_bypass: true
    reviewers: []
    deployment_branch_policy:
      custom_branch_policies:
      - name: main
