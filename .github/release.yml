changelog:
  exclude:
    labels:
      - tagpr
  categories:
    - title: Web
      labels:
        - web
      exclude:
        labels:
          - documentation
          - maintenance
    - title: Android
      labels:
        - android
      exclude:
        labels:
          - documentation
          - maintenance
    - title: CLI
      labels:
        - cli
      exclude:
        labels:
          - documentation
          - maintenance
    - title: Desktop
      labels:
        - desktop
      exclude:
        labels:
          - documentation
          - maintenance
    - title: New Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - maintenance
    - title: Other Changes
      labels:
        - "*"
