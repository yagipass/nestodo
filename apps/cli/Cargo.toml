[package]
name = "nestodo-cli"
version = "0.9.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT AND Apache-2.0"

[[bin]]
name = "nestodo"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crypto_box = "0.9.1"
dirs = "7.0.0"
keyring = "4.2.0"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"
url = "2.5.8"
webbrowser = "1.2.4"

[dev-dependencies]
mockito = "1.7.2"
