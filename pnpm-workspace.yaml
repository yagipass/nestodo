packages:
  - apps/*

minimumReleaseAgeExclude:
  - void
  - '@void/*'
  - '@cloudflare/*'
  - cf
  - miniflare
  - wrangler
  - workerd
  - mysql2
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint
  - '@oxlint/*'
  - vitest
  - '@vitest/*'
  - '@better-auth/core@1.7.20'
  - '@better-auth/drizzle-adapter@1.7.20'
  - '@better-auth/kysely-adapter@1.7.20'
  - '@better-auth/memory-adapter@1.7.20'
  - '@better-auth/mongo-adapter@1.7.20'
  - '@better-auth/prisma-adapter@1.7.20'
  - '@better-auth/telemetry@1.7.20'
  - '@vitejs/plugin-react@6.3.0'
  - better-auth@1.7.20
  - hono@4.13.18
  - minimatch@11.0.7
  - postal-mime@4.2.1

allowBuilds:
  better-sqlite3: false
  core-js: false
  esbuild: true
  sharp: true
  workerd: true
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@^1.6.0
peerDependencyRules:
  allowedVersions:
    vite: "*"
