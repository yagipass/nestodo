# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  external_contributors_require_manual_review: true
  ignore:
    files:
      - CHANGELOG.md
      - flake.lock
      - Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/actions.lock
      - apps/web/AGENTS.md
      - apps/web/db/migrations/meta/**
      - apps/android/gradlew
      - apps/android/gradlew.bat
      - apps/android/gradle/wrapper/**
      - apps/android/gradle/gradle-daemon-jvm.properties
    head_branches:
      - "dependabot/**"
    pr_titles:
      - "Release for v*"
  custom_rules:
    - name: Contributing guide
      file_paths:
        - CONTRIBUTING.md

pr_descriptions:
  generate: false
  cubic_review_link: false
